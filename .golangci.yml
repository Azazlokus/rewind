# golangci-lint configuration (v2 schema).
#
# The four linters the repo rules mandate — errcheck, govet, staticcheck,
# ineffassign — are all in golangci-lint's default set, so the gate holds even
# with a bare config. They are listed explicitly here as documentation and to
# fail loudly if a future default ever drops one.
version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
  exclusions:
    rules:
      # Test helpers legitimately ignore errors on cleanup paths.
      - path: _test\.go
        linters:
          - errcheck
