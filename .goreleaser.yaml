# GoReleaser (схема v2). Валидируется `goreleaser check` на каждом PR.
version: 2

project_name: arena

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: arena-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: loadtest
    main: ./cmd/loadtest
    binary: arena-loadtest
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: replay
    main: ./cmd/replay
    binary: arena-replay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [server, loadtest, replay]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Сервер отдаёт клиент из web/, поэтому кладём его в архив вместе с бинарями.
    files:
      - web/**/*
      - README.md
      - README.en.md
      - LICENSE
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto
