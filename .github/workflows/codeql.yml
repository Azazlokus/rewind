# CodeQL — статический анализ безопасности (SAST) от GitHub. Бесплатен для публичных
# репозиториев; результаты — во вкладке Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # еженедельно, понедельник

permissions:
  contents: read
  security-events: write # загрузка результатов code scanning

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      # Go в CodeQL требует сборки (build-mode none не поддерживается). Берём manual
      # с явным `go build ./...` вместо autobuild (тот на этом репо зависал); сборка
      # быстрая, кэш модулей — из setup-go.
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: Build (for CodeQL extraction)
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
