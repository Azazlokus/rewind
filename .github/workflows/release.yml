# Релизы: по тегу vX.Y.Z GoReleaser собирает кросс-платформенные бинари (server,
# loadtest, replay), архивы с web/ и LICENSE, checksums и GitHub Release с
# changelog'ом. На PR — только `goreleaser check` (валидация конфига), без сборки.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # создать GitHub Release (на теге)

jobs:
  validate:
    name: goreleaser check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  release:
    name: goreleaser release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser считает changelog по истории
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
