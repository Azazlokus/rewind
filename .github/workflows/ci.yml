# CI зеркалит локальный гейт: та же `make check`, что обязательна перед коммитом,
# плюс integration и короткий fuzz. Джобы независимы и идут параллельно; PR в main
# считается зелёным, только когда прошли все три.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# На активной ветке держим только один прогон: новый push отменяет предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (lint + race tests)
    runs-on: ubuntu-latest
    # Postgres-сервис: без него store-сьют гоняется только на SQLite; здесь
    # ARENA_TEST_POSTGRES_DSN включает тот же сьют против настоящего Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARENA_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/arena_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      # golangci-lint (v2, под .golangci.yml) локально не всегда стоит — в CI ставим
      # всегда, чтобы `make check` прогонял ПОЛНЫЙ линт-гейт (errcheck/govet/
      # staticcheck/ineffassign), а не откатывался на один `go vet`.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make check
        run: make check

  integration:
    name: integration (e2e, build tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: make integration
        run: make integration

  fuzz:
    name: fuzz (short, protocol + replay decoders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: make fuzz
        run: make fuzz
