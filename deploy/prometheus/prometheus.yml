# Конфигурация Prometheus для локального стека (docker-compose.yml).
# Скрейпит игровой сервер по /metrics и себя. Правила алертов — в alerts.yml;
# Alertmanager намеренно не поднимается (маршрутизация в Slack/почту — деплой-специфична),
# правила всё равно вычисляются и видны во вкладке Alerts самого Prometheus и в Grafana.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: arena
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
