# Provisioning источников данных Grafana из того же compose-стека: Prometheus
# (метрики) и Jaeger (трейсы OTel, итер. 34). uid'ы фиксированы, чтобы дашборды/
# ссылки на них были стабильны.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: arena-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    type: jaeger
    uid: arena-jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
